name: iOS Offline Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      PROJECT: JMComic.xcodeproj
      SCHEME: BoleReader
      APP_NAME: BoleReader

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Build offline release
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/offline-derived" \
            CODE_SIGNING_ALLOWED=NO \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            DEAD_CODE_STRIPPING=YES \
            build | tee "$RUNNER_TEMP/offline-build.log"

      - name: Strip and verify final executable
        run: |
          set -euo pipefail
          EXECUTABLE="$RUNNER_TEMP/offline-derived/Build/Products/Release-iphoneos/$APP_NAME.app/$APP_NAME"
          xcrun strip -S -x -T "$EXECUTABLE"
          python3 scripts/verify_release.py "$EXECUTABLE"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R "$RUNNER_TEMP/offline-derived/Build/Products/Release-iphoneos/$APP_NAME.app" build/Payload/
          cd build
          zip -qry "啵乐阅读-1.0.5-110-unsigned.ipa" Payload

      - name: Verify packaged app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import plistlib
          import zipfile

          with zipfile.ZipFile("build/啵乐阅读-1.0.5-110-unsigned.ipa") as package:
              prefix = "Payload/BoleReader.app/"
              info = plistlib.loads(package.read(prefix + "Info.plist"))
              assert info["CFBundleShortVersionString"] == "1.0.5"
              assert info["CFBundleVersion"] == "110"
              primary = info["CFBundleIcons"]["CFBundlePrimaryIcon"]
              assert primary["CFBundleIconName"] == "AppIcon"
              assert package.getinfo(prefix + "Assets.car").file_size > 0
              print("Offline package verified: version 1.0.5, build 110, AppIcon present")
          PY

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: BoleReader-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BoleReader-build-logs
          path: ${{ runner.temp }}/offline-build.log
          if-no-files-found: warn
          retention-days: 7
