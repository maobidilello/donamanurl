name: iOS Obfuscated Build

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      obfuscate:
        description: "Obfuscate Swift source before the final build"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 45
    env:
      PROJECT: JMComic.xcodeproj
      SCHEME: JMComic
      APP_NAME: JMComic

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '16.4'

      - name: Build original source
        run: |
          set -euo pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/original-derived" \
            CODE_SIGNING_ALLOWED=NO \
            build | tee "$RUNNER_TEMP/original-build.log"

      - name: Obfuscate sensitive Swift strings
        if: github.event_name == 'push' || inputs.obfuscate
        run: |
          set -euo pipefail
          python3 scripts/obfuscate_strings.py | tee "$RUNNER_TEMP/obfuscation.log"
          mkdir -p artifacts/obfuscated-source
          cp JMComic/*.swift artifacts/obfuscated-source/

      - name: Build final source
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.obfuscate }}" = "true" ]; then
            BUILD_DERIVED="$RUNNER_TEMP/obfuscated-derived"
          else
            BUILD_DERIVED="$RUNNER_TEMP/original-derived"
          fi
          echo "BUILD_DERIVED=$BUILD_DERIVED" >> "$GITHUB_ENV"
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$BUILD_DERIVED" \
            CODE_SIGNING_ALLOWED=NO \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            DEAD_CODE_STRIPPING=YES \
            build | tee "$RUNNER_TEMP/final-build.log"

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          mkdir -p build/Payload
          cp -R "$BUILD_DERIVED/Build/Products/Release-iphoneos/$APP_NAME.app" build/Payload/
          cd build
          zip -qry "啵乐漫画-1.0.0-unsigned.ipa" Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-unsigned-ipa
          path: build/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload obfuscation report and source
        if: github.event_name == 'push' || inputs.obfuscate
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-obfuscation-report-and-source
          path: artifacts/
          if-no-files-found: error
          retention-days: 90

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: JMComic-build-logs
          path: |
            ${{ runner.temp }}/original-build.log
            ${{ runner.temp }}/obfuscation.log
            ${{ runner.temp }}/final-build.log
          if-no-files-found: warn
          retention-days: 7
