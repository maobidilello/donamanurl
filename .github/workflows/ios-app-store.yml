name: iOS App Store Sign and Upload

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sign-and-upload:
    runs-on: macos-26-intel
    timeout-minutes: 45
    env:
      PROJECT: JMComic.xcodeproj
      SCHEME: BoleReader
      APP_NAME: BoleReader
      TEAM_ID: PC7MX37P2C
      BUNDLE_ID: com.bole.reader
      PROFILE_NAME: Bole Reader App Store

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.4'

      - name: Install distribution certificate and profile
        env:
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/build_certificate.p12"
          PP_PATH="$RUNNER_TEMP/build_pp.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/app-signing.keychain-db"
          echo -n "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          echo -n "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PP_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/build_pp.mobileprovision"

      - name: Archive signed App Store build
        run: |
          set -euo pipefail
          mkdir -p build
          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/app-store-derived" \
            -archivePath build/BoleReader.xcarchive \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            STRIP_INSTALLED_PRODUCT=YES \
            STRIP_STYLE=all \
            DEAD_CODE_STRIPPING=YES \
            archive | tee "$RUNNER_TEMP/app-store-archive.log"

      - name: Export signed IPA
        run: |
          set -euo pipefail
          cat > build/ExportOptions.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "https://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>PC7MX37P2C</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bole.reader</key>
              <string>Bole Reader App Store</string>
            </dict>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild \
            -exportArchive \
            -archivePath build/BoleReader.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist \
            -exportPath build/export | tee "$RUNNER_TEMP/app-store-export.log"

      - name: Verify signature and release executable
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA"
          unzip -q "$IPA" -d "$RUNNER_TEMP/signed-ipa"
          APP="$RUNNER_TEMP/signed-ipa/Payload/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          python3 scripts/verify_release.py "$APP/$APP_NAME"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist"

      - name: Upload to App Store Connect
        env:
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          IPA="$(find build/export -name '*.ipa' -print -quit)"
          test -n "$IPA"
          API_KEY_DIR="$HOME/.appstoreconnect/private_keys"
          mkdir -p "$API_KEY_DIR"
          echo -n "$API_KEY_BASE64" | base64 --decode -o "$API_KEY_DIR/AuthKey_$API_KEY_ID.p8"
          xcrun altool \
            --upload-app \
            --type ios \
            --file "$IPA" \
            --apiKey "$API_KEY_ID" \
            --apiIssuer "$API_ISSUER_ID" | tee "$RUNNER_TEMP/app-store-upload.log"

      - name: Upload signed IPA artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: BoleReader-app-store-signed-ipa
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 7

      - name: Upload failure logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: BoleReader-app-store-failure-logs
          path: |
            ${{ runner.temp }}/app-store-archive.log
            ${{ runner.temp }}/app-store-export.log
            ${{ runner.temp }}/app-store-upload.log
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up signing files
        if: always()
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          security delete-keychain "$RUNNER_TEMP/app-signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/build_certificate.p12"
          rm -f "$RUNNER_TEMP/build_pp.mobileprovision"
          rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/build_pp.mobileprovision"
          rm -f "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
